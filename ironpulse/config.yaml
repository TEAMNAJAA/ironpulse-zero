capture:
  default_fps: 240.0
  min_frames: 1000
  max_frames: 2000
  fps_mismatch_warn_ratio: 0.1
  reader: ffmpeg
  ios_export_trim_sec: 5.5
  min_record_sec: 11.0
  pixel_format: gray

tracking:
  win_size: 25
  max_level: 3
  max_iter: 40
  epsilon: 0.001
  roi_margin_px: 40
  subpix_win: 5
  min_eig_threshold: 0.0001
  crop_before_pyramid: true
  checker_half_px: 11
  reacquire_radius_px: 170
  reacquire_min_response: 8000.0

analysis:
  detrend_order: 2
  window_fn: hann
  order_tolerance: 0.08
  rms_order_min: 0.10
  bands:
    sub: [0.10, 0.80]
    one_x: [0.80, 1.20]
    mid: [1.20, 3.50]
    high: [3.50, null]
  f0_shift_warn: 0.05
  min_revolutions: 12.5
  shaft_band_hz: [10.0, 30.0]
  use_baseline_f0: true
  spectrum_order_max: 6.0
  spectrum_points: 700
  window_sec: 1.0
  hop_sec: 0.25

features:
  keep:
    - r1
    - r2
    - r3
    - r05
    - rbp
    - E_sub
    - E_1x
    - E_mid
    - E_hi
    - harm
    - centroid
    - crest
    - kurt
  signals: [d_machine_x, d_machine_y, d_base_y]
  model_signals: [d_machine_x, d_machine_y, d_base_y]

model:
  type: isolation_forest
  feature_set: primary
  pca_variance: 0.95
  n_components_max_frac: 0.25
  threshold_percentile: 95
  threshold_margin: 1.0
  min_baseline_clips: 20
  warn_baseline_clips: 30
  random_state: 42
  mahalanobis:
    pca_variance: 0.95
    n_components_max_frac: 0.25
  ocsvm:
    nu: 0.05
    kernel: rbf
    gamma: scale
  isolation_forest:
    n_estimators: 300
    max_samples: auto

machine:
  blade_count: 3
  rbp_min_blade_count: 4

scale:
  calibration_file: calibration.json
  flow_resolution_px: 0.05
  setup_id: null

quality:
  min_a1_over_noise: 4.16
  min_peak_prominence: 1.3
  noise_estimate_order_band: [6.0, null]
  warn_below_ratio: 4.16
  pixels_per_cm_1080p_30cm: 42.9

rules:
  z_threshold: 3.0
  z_std_floor_frac: 0.01
  z_broadband_frac: 0.8

ui:
  language: th
  verdict_font_px: 56

web:
  host: 127.0.0.1
  port: 8765
  open_browser: true
  data_dir: data
  demo_dir: data/demo
  upload_dir: data/uploads
  db_file: data/ironpulse.db
  max_upload_mb: 500
  a1_floor_warn_ratio: 1.5
  session_gap_sec: 120
  target_seconds: 12.0
  video_suffixes: [.mov, .mp4, .m4v, .avi, .mkv]
